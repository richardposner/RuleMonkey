site_name: RuleMonkey
site_description: >-
  A network-free stochastic simulator for rule-based biochemical models
  written in BNGL.
site_url: https://richardposner.github.io/RuleMonkey/
repo_url: https://github.com/richardposner/RuleMonkey
repo_name: richardposner/RuleMonkey
edit_uri: edit/main/docs/
copyright: RuleMonkey contributors

# The docs are ordinary markdown files that stay readable in the repo, so
# nothing here may depend on the site being built.  `strict` turns a broken
# internal link or a page missing from the nav into a build failure, which is
# what keeps the two views from drifting.
strict: true

docs_dir: docs

theme:
  name: material
  logo: rulemonkey-macaque-logo/rulemonkey-logo.svg
  favicon: rulemonkey-macaque-logo/rulemonkey-favicon.svg
  features:
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - navigation.indexes
    - content.code.copy
    - content.action.edit
    - search.suggest
    - search.highlight
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: brown
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: brown
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  # permalink gives every heading a stable anchor, so a section of
  # model_semantics.md can be cited directly.
  - toc:
      permalink: true
      toc_depth: 3
  - admonition
  - attr_list
  - tables
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets

plugins:
  - search

nav:
  - Home: index.md
  - Quickstart: quickstart.md
  - BNGL coverage and semantics: model_semantics.md
  - Troubleshooting and FAQ: troubleshooting.md
  - Output formats:
      - .gdat trajectories: gdat_format.md
      - .species enumeration: species_format.md
      - .scan parameter sweeps: scan_format.md
  - Performance: timing_comparison.md
  # Contributor-facing.  Kept on the site because it is public anyway and
  # linked from the repo, but out of the user-facing flow above.
  - Contributing:
      - Engine internals: internals.md
      - Test corpora: test_corpora.md
