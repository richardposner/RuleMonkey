name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # On-demand runs for any ref, via `gh workflow run ci.yml --ref main`.
  # Push and pull_request cover normal development, but neither can be
  # replayed: a runner outage that drops a push event leaves that commit
  # with no run and no way to ask for one, and tags don't trigger this
  # workflow at all, so a release commit can go unverified.  Re-running an
  # existing run replays its own commit, not HEAD.
  workflow_dispatch:

jobs:
  build:
    # macOS and Windows run build + ctest only (the feature_coverage
    # benchmark job below requires the Linux-only NFsim binary from
    # BioNetGen).  Treat those two legs as "build-clean" gates, not
    # correctness gates.
    #
    # All three legs use the same Ninja `release` preset on purpose.  A
    # multi-config Visual Studio generator would leave CMAKE_BUILD_TYPE
    # empty, which silently changes which self-check defines CMakeLists.txt
    # compiles in (`CMAKE_BUILD_TYPE STREQUAL "Debug"`), so the Windows leg
    # would no longer be testing the same configuration as the other two.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    # No Ninja install step: all three hosted images ship Ninja 1.13.2 on
    # PATH.  seanmiddleditch/gha-setup-ninja used to provide it, but that
    # action is archived and never moved off Node 20 (issue #30), and the
    # image's copy is the same generator with one fewer dependency.  If a
    # future image drops it, `cmake --preset release` fails at configure
    # with "CMAKE_MAKE_PROGRAM is not set", which is a clear enough signal.
    steps:
      - uses: actions/checkout@v7

      # cl.exe and the Windows SDK are not on PATH on the hosted Windows
      # image — only the Visual Studio generator finds them unaided.  With
      # the Ninja generator CMake would otherwise pick up whatever compiler
      # happens to be on PATH (the Strawberry Perl gcc) or fail its compiler
      # check outright, so put the MSVC environment in place first.
      #
      # Done by hand rather than with an action because every MSVC-environment
      # action is still Node 20 — ilammy/msvc-dev-cmd, microsoft/setup-msbuild
      # and TheMrMilchmann/setup-msvc-dev alike — which is the deprecation
      # issue #30 exists to clear.  vswhere.exe ships with the image, so this
      # needs nothing the runner does not already have.
      - name: Set up MSVC environment (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw "vswhere found no Visual Studio install carrying the VC x64 toolset" }

          # vcvars64.bat mutates its own process environment, which dies with
          # the cmd.exe that ran it, so `&& set` is the only way to read back
          # what it exported.
          $vcvars = Join-Path $vs 'VC\Auxiliary\Build\vcvars64.bat'
          $after = @{}
          cmd /c "`"$vcvars`" >nul 2>&1 && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') { $after[$matches[1]] = $matches[2] }
          }
          if (-not $after.ContainsKey('INCLUDE')) { throw "vcvars64.bat exported no INCLUDE; MSVC environment not established" }

          # PATH goes through $GITHUB_PATH, the documented channel, and carries
          # only the entries vcvars added.  INCLUDE / LIB / LIBPATH do not exist
          # beforehand, so those are written whole.
          $before = $env:PATH -split ';'
          ($after['PATH'] -split ';') |
            Where-Object { $_ -and $before -notcontains $_ } |
            Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          foreach ($name in 'INCLUDE', 'LIB', 'LIBPATH') {
            "$name=$($after[$name])" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }

      - name: Configure
        run: cmake --preset release

      - name: Build
        run: cmake --build --preset release

      - name: Test
        run: ctest --preset release

  asan:
    # AddressSanitizer + UBSan run of the unit-test suite.  This is the
    # correctness gate for memory / pointer / index / signed-overflow
    # bugs that observable-trajectory parity tests in feature_coverage
    # cannot see (e.g., a use-after-free in pool reuse that happens to
    # land on zeroed memory).  Both Linux (libstdc++ + clang asan) and
    # macOS (libc++ + AppleClang asan) are exercised, since std-lib
    # divergence is exactly the kind of thing that hides UB on one
    # platform and reveals it on the other.
    #
    # Deliberately no windows-latest leg: `-fsanitize=address,undefined` is
    # the GCC/Clang spelling, MSVC wants `/fsanitize=address` and ships no
    # UBSan at all, and CMakeLists.txt refuses RULEMONKEY_ENABLE_ASAN
    # outside Clang/GCC for that reason.  Windows is a build + ctest gate
    # only.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - name: Configure (asan)
        run: cmake --preset asan

      - name: Build (asan)
        run: cmake --build --preset asan

      - name: Test (asan)
        # UBSAN_OPTIONS=print_stacktrace=1 surfaces the call site, not
        # just the diagnostic line — required to triage macOS UBSan
        # findings, which historically lacked symbolized traces.
        run: UBSAN_OPTIONS=print_stacktrace=1:halt_on_error=1 ASAN_OPTIONS=detect_leaks=0 ctest --preset asan

  feature_coverage:
    # Runs the full feature_coverage benchmark on every push / PR.  ctest
    # alone would not catch regressions in simulation correctness — the
    # smoke test only verifies the engine loads and steps an XML.  This
    # job runs the 77-model RM-vs-NFsim z-score + RM-vs-ODE rel-err
    # comparison that surfaced the self-binding propensity bug, the MM
    # silent-zero-rate bug, the TFUN sentinel typo, etc., in development.
    #
    # Wall budget: ~3-5 min including BioNetGen download and RM build.
    # Linux only: the BioNetGen release tarball ships a Linux NFsim
    # binary, but no macOS binary that matches the GitHub Actions runner.
    runs-on: ubuntu-latest
    needs: build  # don't bother running benchmark if the build is broken

    env:
      BNG_VERSION: "2.9.3"

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Download BioNetGen + NFsim (Linux)
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/bng.tgz \
            "https://github.com/RuleWorld/bionetgen/releases/download/BioNetGen-${BNG_VERSION}/BioNetGen-${BNG_VERSION}-linux.tar.gz"
          tar -xzf /tmp/bng.tgz -C /tmp/
          BNG_DIR="/tmp/BioNetGen-${BNG_VERSION}"
          test -x "${BNG_DIR}/BNG2.pl"     # script
          test -x "${BNG_DIR}/bin/NFsim"   # bundled NFsim binary
          echo "BNG2=${BNG_DIR}/BNG2.pl"       >> "$GITHUB_ENV"
          echo "NFSIM_BIN=${BNG_DIR}/bin/NFsim" >> "$GITHUB_ENV"

      - name: Build RM
        run: |
          cmake --preset release
          cmake --build --preset release

      - name: Run feature_coverage benchmark
        run: |
          python3 harness/benchmark_feature_coverage.py --reps 5 \
            | tee build/feature_coverage_console.log
          # Fail the job if any model failed.  The runner's tail line is
          # exactly "TOTAL: X PASS / Y FAIL / Z other"; we extract Y.
          fails=$(grep -oE 'TOTAL: [0-9]+ PASS / [0-9]+ FAIL' \
                    build/feature_coverage_console.log \
                  | tail -1 | grep -oE '/ [0-9]+ FAIL' | grep -oE '[0-9]+')
          echo "FAIL count: ${fails:-?}"
          if [[ "${fails:-1}" != "0" ]]; then
            echo "::error::feature_coverage benchmark reported failures"
            exit 1
          fi

      - name: Upload benchmark report
        if: always()  # surface the report even when the job failed
        uses: actions/upload-artifact@v4
        with:
          name: feature-coverage-report
          path: |
            build/feature_coverage_report.md
            build/feature_coverage_console.log
          if-no-files-found: warn

  vendor_check:
    # Guards the vendored BNGsim expression layer (issues #6 / #11) against
    # drift.  scripts/vendor_exprtk.py --check byte-compares the four vendored
    # files (exprtk.hpp + bngsim expression.hpp / expr_compat.hpp /
    # expression.cpp) against their pinned lanl/bngsim commit.  Version skew
    # between RuleMonkey's standalone copy and BNGsim's expression layer is an
    # ODR violation, so any drift here is a build failure.
    #
    # This job was blocked until BNGsim went public: --check has to clone the
    # source repo, and the old wshlavacek/PyBNF-Private monorepo was private
    # (would have needed a stored deploy key / PAT).  lanl/bngsim is public, so
    # the clone needs no credential.  fetch-depth: 0 pulls full history, so the
    # pinned commit stays reachable even after BNGsim's HEAD advances past it.
    # Purely additive: no build, no NFsim/BNG2, ~stdlib-only Python.
    runs-on: ubuntu-latest

    steps:
      - name: Checkout RuleMonkey
        uses: actions/checkout@v7

      - name: Checkout lanl/bngsim (full history for the pinned commit)
        uses: actions/checkout@v7
        with:
          repository: lanl/bngsim
          path: bngsim
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Drift-check vendored BNGsim expression layer
        run: python3 scripts/vendor_exprtk.py --check --bngsim-repo bngsim
