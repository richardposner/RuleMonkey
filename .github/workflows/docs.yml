name: docs

# Builds the MkDocs site from docs/ and publishes it to GitHub Pages.
#
# The build runs on every push and pull request touching the docs, so a broken
# internal link fails the PR (mkdocs.yml sets strict: true).  Only pushes to
# main publish.
#
# Publishing needs one repository setting: Settings -> Pages -> Build and
# deployment -> Source set to "GitHub Actions".  Until that is set the deploy
# is SKIPPED rather than failed, so main does not carry a red X for a setting
# no workflow can make for itself.  The moment Pages is enabled the next run
# publishes, with no change needed here.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install MkDocs Material
        run: pip install "mkdocs-material==9.5.*"
      - name: Build site
        run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  # Is Pages actually enabled on this repository?  Creating a deployment
  # against a repo with Pages off 404s, which would fail the run.  Probing for
  # it first turns that into a skip with a warning annotation, while leaving a
  # genuine deploy failure (bad artifact, expired token, Pages outage) loud.
  pages-enabled:
    # Only publish from main; pull requests get the build check alone.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: read
    outputs:
      enabled: ${{ steps.probe.outputs.enabled }}
    steps:
      - id: probe
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/pages" >/dev/null 2>&1; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=GitHub Pages is not enabled::The site built but was not published. Set Settings -> Pages -> Build and deployment -> Source to 'GitHub Actions', then re-run this workflow."
          fi

  deploy:
    needs: [build, pages-enabled]
    if: needs.pages-enabled.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
