default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]
fail_fast: false

# Vendored third-party sources (ExprTk + bngsim::ExprTkEvaluator — see
# third_party/bngsim_expr/VENDOR) are copied verbatim and must NOT be
# touched by clang-format / whitespace fixers, or they drift from their
# upstream pin.  clang-tidy already scopes itself to cpp/ + tests/cpp/.
exclude: '^third_party/'

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ['--maxkb=3000']  # accommodates basicmodels XMLs (r21 is 2.6MB)
      - id: mixed-line-ending
      - id: debug-statements
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v17.0.6
    hooks:
      - id: clang-format
        files: \.(c|cc|cpp|cxx|h|hh|hpp|hxx)$

  - repo: local
    hooks:
      - id: cmake-configure
        name: cmake-configure
        entry: cmake --preset release
        language: system
        pass_filenames: false
        stages: [pre-push]

      # Lints staged C++ TU files against .clang-tidy using whichever
      # compile_commands.json is available under build/.
      #
      # `language: python` + additional_dependencies so pre-commit installs
      # the binary itself, from the same wheel family as the clang-format
      # hook above, and puts it on PATH for the script.  It used to be
      # `language: system`, which meant the hook only ran for whoever
      # happened to have an LLVM on PATH -- and the script's skip-if-missing
      # branch made that silent, so on a machine without one the gate was
      # simply off and said nothing about it.
      #
      # Pin >= 19: macOS SDK 26's libc++ headers use `__builtin_clzg` /
      # `__builtin_ctzg`, which older clang front-ends do not have, so a
      # clang-tidy 18 run drowns in clang-diagnostic-errors out of <algorithm>
      # before it reaches any RM code.  21.x matches the Apple clang this
      # repo is developed against.
      - id: clang-tidy
        name: clang-tidy
        entry: scripts/clang-tidy-staged.sh
        language: python
        additional_dependencies: ['clang-tidy==21.1.6']
        files: ^(cpp|tests/cpp)/.+\.(c|cc|cpp|cxx)$
        pass_filenames: true
